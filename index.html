<!DOCTYPE html>
<html lang="en">
<head>
  <!-- skoop-live-runtime -->
  <script src="./skoop-live.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forge Burgers • Menu Board</title>
  <style>
    :root {
      --primary-color: #ff6b35;
      --accent-color: #f4a261;
      --background-color: #1a1a1a;
      --text-color: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--background-color);
      color: var(--text-color);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #app-container {
      opacity: 0;
      transition: opacity 0.4s ease;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #app-container.loaded {
      opacity: 1;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5vh 3vw;
      background: #111;
      border-bottom: 4px solid var(--primary-color);
      flex-shrink: 0;
    }

    .logo {
      height: 9vh;
      width: auto;
    }

    .locations {
      display: flex;
      gap: 2vw;
    }

    .location-badge {
      background: #222;
      padding: 1vh 2.5vw;
      border-radius: 999px;
      text-align: center;
      border: 2px solid var(--accent-color);
    }

    .location-name {
      font-size: 2.2vh;
      font-weight: 700;
      color: var(--accent-color);
    }

    .location-address {
      font-size: 1.4vh;
      opacity: 0.85;
    }

    .mode-indicator {
      font-size: 2.4vh;
      font-weight: 800;
      padding: 1vh 2.5vw;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .mode-normal { background: #333; }
    .mode-lunch { background: #ff6b35; color: #111; }
    .mode-late { background: #222; border: 3px solid #666; }

    .hero {
      position: relative;
      height: 32vh;
      overflow: hidden;
      flex-shrink: 0;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.75);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(26,26,26,0.85));
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .hero-content h1 {
      font-size: 9vh;
      font-weight: 900;
      margin-bottom: 0.5vh;
      text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .hero-content p {
      font-size: 3vh;
      opacity: 0.95;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 2vh 3vw 3vh;
      overflow: hidden;
      gap: 2.5vh;
    }

    .section-title {
      font-size: 4.2vh;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 1.5vw;
      margin-bottom: 1vh;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 3px;
      background: linear-gradient(to right, var(--primary-color), transparent);
    }

    .specials-grid,
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2vw;
    }

    .menu-card {
      background: #222;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
    }

    .menu-card img {
      width: 100%;
      height: 22vh;
      object-fit: cover;
    }

    .card-content {
      padding: 2.2vh 2vw;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .item-name {
      font-size: 3vh;
      font-weight: 700;
      margin-bottom: 0.8vh;
    }

    .item-desc {
      font-size: 1.9vh;
      line-height: 1.3;
      opacity: 0.85;
      flex: 1;
      margin-bottom: 1vh;
    }

    .price {
      font-size: 3.8vh;
      font-weight: 800;
      color: var(--primary-color);
      align-self: flex-end;
    }

    .specials-grid .menu-card {
      border-color: var(--primary-color);
    }

    .combos-section {
      background: #111;
      border: 4px solid var(--primary-color);
      border-radius: 20px;
      padding: 2.5vh 3vw;
    }

    .combo-card {
      display: flex;
      gap: 2.5vw;
      align-items: center;
      background: #1f1f1f;
      border-radius: 14px;
      padding: 1.8vh 2vw;
    }

    .combo-card img {
      width: 18vw;
      height: 18vh;
      object-fit: cover;
      border-radius: 12px;
    }

    .combo-info {
      flex: 1;
    }

    .combo-name {
      font-size: 3.6vh;
      font-weight: 800;
    }

    .combo-desc {
      font-size: 2.1vh;
      opacity: 0.8;
      margin: 0.6vh 0;
    }

    .combo-pricing {
      display: flex;
      align-items: baseline;
      gap: 1.5vw;
    }

    .combo-price {
      font-size: 5vh;
      font-weight: 900;
      color: var(--primary-color);
    }

    .original-price {
      font-size: 2.8vh;
      text-decoration: line-through;
      opacity: 0.5;
    }

    .save-badge {
      background: #ff6b35;
      color: #111;
      font-weight: 800;
      padding: 0.6vh 1.8vw;
      border-radius: 999px;
      font-size: 2vh;
      margin-left: auto;
    }

    .late-mode {
      filter: brightness(0.55) saturate(0.6);
      transition: filter 0.6s ease;
    }

    .late-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .late-overlay.active {
      display: flex;
    }

    .late-content {
      text-align: center;
      max-width: 80vw;
    }

    .late-title {
      font-size: 8vh;
      font-weight: 900;
      margin-bottom: 2vh;
      color: #888;
    }

    .late-menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3vw;
    }

    .late-card {
      background: #111;
      border: 2px solid #444;
      border-radius: 18px;
      overflow: hidden;
      padding-bottom: 2vh;
    }

    .late-card img {
      width: 100%;
      height: 28vh;
      object-fit: cover;
    }

    .late-card .item-name {
      font-size: 3.4vh;
      padding: 0 2vw;
      margin-top: 1.5vh;
    }

    .late-card .price {
      padding: 0 2vw;
      font-size: 4.5vh;
    }

    .ticker {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.7);
      padding: 1vh 0;
      font-size: 2vh;
      overflow: hidden;
      white-space: nowrap;
    }

    .ticker-content {
      display: inline-block;
      animation: ticker 25s linear infinite;
    }

    @keyframes ticker {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .mode-banner {
      text-align: center;
      padding: 1vh 0;
      font-weight: 800;
      font-size: 3vh;
      letter-spacing: 3px;
    }

    .lunch-banner {
      background: linear-gradient(90deg, #ff6b35, #f4a261);
      color: #111;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <!-- Header -->
    <header class="header">
      <img class="logo" data-bind-src="storefront.logo" src="assets/logo_k7m2x9.png" alt="Forge Burgers">

      <div class="locations" id="locations-container">
        <!-- Populated by JS -->
      </div>

      <div id="mode-indicator" class="mode-indicator mode-normal">
        REGULAR MENU
      </div>
    </header>

    <!-- Hero -->
    <div class="hero">
      <img src="assets/hero_burger_a1b2c3.png" alt="Signature Burger">
      <div class="hero-overlay">
        <div class="hero-content">
          <h1 data-bind-text="storefront.chain_name">Forge Burgers</h1>
          <p data-bind-text="storefront.tagline">Crafted Over Flame</p>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="content">
      <!-- Mode Banner -->
      <div id="mode-banner"></div>

      <!-- Daily Specials -->
      <div id="specials-section">
        <div class="section-title">Today's Specials</div>
        <div class="specials-grid" id="specials-grid">
          <!-- Populated dynamically -->
        </div>
      </div>

      <!-- Main Menu -->
      <div id="menu-section">
        <div class="section-title">Signature Menu</div>
        <div class="menu-grid" id="menu-grid">
          <!-- Populated dynamically -->
        </div>
      </div>

      <!-- Lunch Combos -->
      <div id="combos-section" style="display: none;">
        <div class="section-title" style="color: #ff6b35;">Lunch Rush Combos • Limited Time</div>
        <div class="combos-section">
          <div id="combos-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 2vw;">
            <!-- Populated dynamically -->
          </div>
        </div>
      </div>

      <!-- Late Night Menu (replaces others) -->
      <div id="late-section" style="display: none; position: relative; z-index: 20;">
        <div class="late-content">
          <div class="late-title">LATE NIGHT MENU</div>
          <div class="late-menu-grid" id="late-grid">
            <!-- Populated dynamically -->
          </div>
        </div>
      </div>
    </div>

    <!-- Ticker -->
    <div class="ticker">
      <div class="ticker-content">
        <span data-bind-text="locations.0.name">Downtown</span> &amp; <span data-bind-text="locations.1.name">Riverside</span> • Open Daily • Fresh Never Frozen • Crafted Over Flame &nbsp;&nbsp;&nbsp;•&nbsp;&nbsp;&nbsp;
        <span data-bind-text="locations.0.name">Downtown</span> &amp; <span data-bind-text="locations.1.name">Riverside</span> • Open Daily • Fresh Never Frozen • Crafted Over Flame
      </div>
    </div>
  </div>

  <script>
    let currentMode = 'normal';
    let dataCache = null;
    let modeCheckInterval = null;

    async function loadAppData() {
      try {
        const response = await fetch('data.json');
        const data = await response.json();
        dataCache = data;
        return data;
      } catch (error) {
        console.error('Failed to load app data:', error);
        return null;
      }
    }

    function getCurrentMode(settings) {
      const hour = new Date().getHours();
      const lunchStart = settings.lunch_start_hour.value;
      const lunchEnd = settings.lunch_end_hour.value;
      const lateStart = settings.late_start_hour.value;

      if (hour >= lunchStart && hour < lunchEnd) {
        return 'lunch';
      } else if (hour >= lateStart) {
        return 'late';
      }
      return 'normal';
    }

    function updateModeIndicator(mode) {
      const indicator = document.getElementById('mode-indicator');
      const banner = document.getElementById('mode-banner');

      if (mode === 'lunch') {
        indicator.textContent = 'LUNCH RUSH';
        indicator.className = 'mode-indicator mode-lunch';
        banner.innerHTML = '<div class="mode-banner lunch-banner">⚡ LUNCH RUSH • COMBO DEALS ACTIVE 11AM – 2PM ⚡</div>';
        banner.style.display = 'block';
      } else if (mode === 'late') {
        indicator.textContent = 'LATE NIGHT';
        indicator.className = 'mode-indicator mode-late';
        banner.style.display = 'none';
      } else {
        indicator.textContent = 'REGULAR MENU';
        indicator.className = 'mode-indicator mode-normal';
        banner.style.display = 'none';
      }
    }

    function renderLocations(locations) {
      const container = document.getElementById('locations-container');
      container.innerHTML = '';

      locations.forEach((loc, idx) => {
        const badge = document.createElement('div');
        badge.className = 'location-badge';
        badge.innerHTML = `
          <div class="location-name" data-bind-text="locations.${idx}.name">${loc.name}</div>
          <div class="location-address" data-bind-text="locations.${idx}.address">${loc.address}</div>
        `;
        container.appendChild(badge);
      });
    }

    function renderSpecials(specials) {
      const grid = document.getElementById('specials-grid');
      grid.innerHTML = '';

      specials.forEach((special, idx) => {
        const card = document.createElement('div');
        card.className = 'menu-card';
        card.innerHTML = `
          <img data-bind-src="daily_specials.${idx}.image" src="${special.image}" alt="${special.name}">
          <div class="card-content">
            <div class="item-name" data-bind-text="daily_specials.${idx}.name">${special.name}</div>
            <div class="item-desc" data-bind-text="daily_specials.${idx}.description">${special.description}</div>
            <div class="price" data-bind-currency="daily_specials.${idx}.price">$${special.price.toFixed(2)}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderMenu(items, categories) {
      const grid = document.getElementById('menu-grid');
      grid.innerHTML = '';

      // Group by category
      const burgers = items.filter(i => i.category === 'cat_b1u2r3');
      const sides = items.filter(i => i.category === 'cat_s4i5d6');
      const drinks = items.filter(i => i.category === 'cat_d7r8i9');

      const all = [...burgers, ...sides, ...drinks];

      all.forEach((item, idx) => {
        const originalIdx = items.findIndex(i => i.id === item.id);
        const card = document.createElement('div');
        card.className = 'menu-card';
        card.innerHTML = `
          <img data-bind-src="menu_items.${originalIdx}.image" src="${item.image}" alt="${item.name}">
          <div class="card-content">
            <div class="item-name" data-bind-text="menu_items.${originalIdx}.name">${item.name}</div>
            <div class="item-desc" data-bind-text="menu_items.${originalIdx}.description">${item.description}</div>
            <div class="price" data-bind-currency="menu_items.${originalIdx}.price">$${item.price.toFixed(2)}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderCombos(combos) {
      const container = document.getElementById('combos-grid');
      container.innerHTML = '';

      combos.forEach((combo, idx) => {
        const card = document.createElement('div');
        card.className = 'combo-card';
        const savings = (combo.original_price - combo.price).toFixed(2);
        card.innerHTML = `
          <img data-bind-src="lunch_combos.${idx}.image" src="${combo.image}" alt="${combo.name}">
          <div class="combo-info">
            <div class="combo-name" data-bind-text="lunch_combos.${idx}.name">${combo.name}</div>
            <div class="combo-desc" data-bind-text="lunch_combos.${idx}.description">${combo.description}</div>
            <div class="combo-pricing">
              <span class="combo-price" data-bind-currency="lunch_combos.${idx}.price">$${combo.price.toFixed(2)}</span>
              <span class="original-price" data-bind-currency="lunch_combos.${idx}.original_price">$${combo.original_price.toFixed(2)}</span>
              <div class="save-badge">SAVE $${savings}</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderLateMenu(lateItems) {
      const grid = document.getElementById('late-grid');
      grid.innerHTML = '';

      lateItems.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'late-card';
        card.innerHTML = `
          <img data-bind-src="late_menu.${idx}.image" src="${item.image}" alt="${item.name}">
          <div class="item-name" data-bind-text="late_menu.${idx}.name">${item.name}</div>
          <div class="price" data-bind-currency="late_menu.${idx}.price">$${item.price.toFixed(2)}</div>
        `;
        grid.appendChild(card);
      });
    }

    function applyModeStyles(mode, container) {
      if (mode === 'late') {
        container.classList.add('late-mode');
      } else {
        container.classList.remove('late-mode');
      }
    }

    function showSection(sectionId, show) {
      document.getElementById(sectionId).style.display = show ? 'block' : 'none';
    }

    async function init() {
      const data = await loadAppData();
      if (!data) return;

      const settings = data.sections.app_settings;
      const storefront = data.sections.storefront;

      // Apply colors from data
      document.documentElement.style.setProperty('--primary-color', settings.primary_color.value);
      document.documentElement.style.setProperty('--accent-color', settings.accent_color.value);
      document.documentElement.style.setProperty('--background-color', settings.background_color.value);
      document.documentElement.style.setProperty('--text-color', settings.text_color.value);

      // Render static elements
      renderLocations(data.sections.locations.value);

      // Determine initial mode
      const mode = getCurrentMode(settings);
      currentMode = mode;
      updateModeIndicator(mode);

      const container = document.getElementById('app-container');

      // Render based on mode
      if (mode === 'late') {
        showSection('specials-section', false);
        showSection('menu-section', false);
        showSection('combos-section', false);
        showSection('late-section', true);
        applyModeStyles('late', container);
        renderLateMenu(data.sections.late_menu.value);
      } else {
        showSection('late-section', false);
        showSection('specials-section', true);
        showSection('menu-section', true);

        renderSpecials(data.sections.daily_specials.value);
        renderMenu(data.sections.menu_items.value, data.sections.categories.value);

        if (mode === 'lunch') {
          showSection('combos-section', true);
          renderCombos(data.sections.lunch_combos.value);
        } else {
          showSection('combos-section', false);
        }
        applyModeStyles('normal', container);
      }

      // Reveal app
      container.classList.add('loaded');

      // Start periodic mode check
      if (modeCheckInterval) clearInterval(modeCheckInterval);
      modeCheckInterval = setInterval(async () => {
        const newData = dataCache || await loadAppData();
        if (!newData) return;

        const newMode = getCurrentMode(newData.sections.app_settings);
        if (newMode !== currentMode) {
          // Mode changed – re-init for simplicity and cleanliness
          location.reload();
        }
      }, 60000);
    }

    init();
  </script>
</body>
</html>
